name: LocalPaste
options:
  bundleIdPrefix: com.prince
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "2"
    LOCALPASTE_REVISION: "local"
    SYSTEM_HEADER_SEARCH_PATHS: "$(SDKROOT)/usr/include/libxml2"
targets:
  LocalPaste:
    type: application
    platform: macOS
    sources:
      - path: LocalPaste
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prince.LocalPaste
        PRODUCT_NAME: Clipmori
        EXECUTABLE_NAME: LocalPaste
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: LocalPaste/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    scheme:
      gatherCoverageData: false
      testTargets: []
