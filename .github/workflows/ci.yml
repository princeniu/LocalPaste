name: macOS checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Prepare XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Run isolated regressions
        run: scripts/run-regressions.sh
      - name: Build Release
        env:
          LOCALPASTE_BUILD_OUTPUT: ${{ runner.temp }}/LocalPasteRelease
        run: scripts/build-release.sh
      - name: Save unsigned build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Clipmori-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/LocalPasteRelease/Clipmori.zip
            ${{ runner.temp }}/LocalPasteRelease/build-info.json
          if-no-files-found: error
          retention-days: 7
